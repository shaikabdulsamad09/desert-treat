<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your dessert plate</title>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffd9e2;--ink:#3b1f1a;--card:#fff6f8;--berry:#d6336c;--mint:#bde8d4;--line:#3b1f1a22;--plate:#fffdf9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1620;--ink:#ffe9ee;--card:#3a2030;--line:#ffe9ee33}}
:root[data-theme="dark"]{--bg:#2a1620;--ink:#ffe9ee;--card:#3a2030;--line:#ffe9ee33}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;min-height:100vh}
h1{font-family:'Bagel Fat One',Georgia,serif;font-weight:400;font-size:clamp(2rem,6vw,3.4rem);line-height:1.05;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px 40px}
header p{margin:8px 0 0;max-width:46ch;font-size:1.05rem;line-height:1.5}
.app{display:grid;gap:20px;margin-top:20px;grid-template-columns:1fr}
@media(min-width:820px){.app{grid-template-columns:1.1fr .9fr;align-items:start}}
.stage{background:var(--card);border-radius:28px;padding:16px;border:2px solid var(--line)}
.plate{position:relative;width:100%;max-width:520px;margin:0 auto;aspect-ratio:1;border-radius:50%;
background:radial-gradient(circle,var(--plate) 0 58%,#e9dfd2 59% 61%,var(--plate) 62% 100%);box-shadow:0 14px 30px #0003;touch-action:none;overflow:hidden}
.it{position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(var(--s,1));transition:transform .18s;touch-action:none;cursor:grab;user-select:none}
.eat .it{cursor:pointer}
.it.pop{animation:pop .3s forwards}
@keyframes pop{to{transform:translate(-50%,-50%) scale(0);opacity:0}}
.scoop{filter:drop-shadow(0 6px 5px #0005)}
.scoop img{display:block;width:100%;height:auto;pointer-events:none}
.bar{width:24%;aspect-ratio:2.6;border-radius:6px;box-shadow:0 4px 6px #0003,inset 0 0 0 2px #fff3}
.ball{width:11%;aspect-ratio:1;border-radius:50%;box-shadow:0 4px 6px #0003;
background:radial-gradient(circle at 35% 30%,#fbe3a0,#c0902f 60%,#7a5416)}
.tri{width:22%;aspect-ratio:1.7;clip-path:polygon(0 100%,50% 0,100% 100%);background:linear-gradient(#f0bd4e,#c9902a)}
.gar{width:11%}.gar svg{display:block;width:100%;height:auto;filter:drop-shadow(0 3px 3px #0004)}.g-blue{width:9%}.g-mint{width:12%}.g-curl{width:15%}.g-orange{width:13%}
.top{font-size:clamp(18px,4.5vw,30px);filter:drop-shadow(0 3px 2px #0003)}
.spr{width:12%;aspect-ratio:1;background:
radial-gradient(circle,#ff4d8d 0 8%,#0000 9%) 10% 20%/30% 30%,radial-gradient(circle,#4dd0e1 0 8%,#0000 9%) 40% 70%/30% 30%,
radial-gradient(circle,#ffd43b 0 8%,#0000 9%) 75% 30%/30% 30%,radial-gradient(circle,#7bd88f 0 8%,#0000 9%) 60% 90%/30% 30%}
.hud{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-top:14px}
.count{font-weight:800}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:800;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer}
button:hover{border-color:var(--berry)}
button:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
button.on{background:var(--berry);color:#fff;border-color:var(--berry)}
.note{text-align:center;margin:14px 0 0;font-size:1.02rem;min-height:1.4em}
.menu{background:var(--card);border-radius:28px;padding:16px;border:2px solid var(--line)}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.opt{display:flex;flex-direction:column;align-items:center;gap:8px;border-radius:18px;padding:12px 6px;font-size:.92rem}
.sw{height:44px;display:flex;align-items:center;justify-content:center}
.sw .scoop,.sw .bar,.sw .ball,.sw .tri,.sw .spr{position:relative;transform:none}
.sw .scoop{width:64px}.sw .gar{width:44px}.sw .bar{width:56px}.sw .ball{width:34px}.sw .tri{width:50px}.sw .spr{width:34px}
@media (prefers-reduced-motion:reduce){.it{transition:none}.it.pop{animation-duration:.01s}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><filter id="real" x="-10%" y="-10%" width="120%" height="125%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="3" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="6" result="d"/><feTurbulence type="fractalNoise" baseFrequency=".32" numOctaves="4" seed="9" result="g"/><feDiffuseLighting in="g" surfaceScale="2.4" diffuseConstant="1.1" lighting-color="#fff" result="lit"><feDistantLight azimuth="235" elevation="55"/></feDiffuseLighting><feComposite in="d" in2="lit" operator="arithmetic" k1="1.25" k2="0" k3="0" k4="0" result="m"/><feComposite in="m" in2="d" operator="in"/></filter>
<filter id="rough" x="-10%" y="-10%" width="120%" height="125%"><feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="3" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5"/></filter><filter id="soft"><feGaussianBlur stdDeviation="2.5"/></filter></defs></svg>
<div class="wrap">
<header>
<h1 id="title">Your plate</h1>
<p id="intro">Pick as many scoops and treats as you want. Drag things around, then switch to eating mode and take bites.</p>
</header>
<main class="app">
<section class="stage" aria-label="Your plate">
<div class="plate" id="plate"></div>
<p class="note" id="note"></p>
<div class="hud">
<span class="count" id="count">Empty plate</span>
<div class="btns">
<button id="eatBtn" aria-pressed="false">Eat mode</button>
<button id="rand">Surprise me</button>
<button id="clear">Clear plate</button>
</div>
</div>
</section>
<section class="menu" aria-label="Menu">
<div class="tabs" role="tablist" id="tabs"></div>
<div class="grid" id="grid"></div>
</section>
</main>
</div>

function R(a,b){return a+Math.random()*(b-a);}
function scal(r,n,a){var p=[],i,t,q;for(i=0;i<n;i++){t=i/n*6.2832;q=r+(i%2?a:-a)*R(.4,1.2);p.push((50+Math.cos(t)*q).toFixed(1)+" "+(50+Math.sin(t)*q).toFixed(1));}return "M"+p.join("L")+"Z";}
function scoopSVG(f){
  var id="g"+Math.floor(Math.random()*1e9), t="", i, k=f[4], c=f[5], a, r;
  function pt(m){a=R(0,6.283);r=Math.sqrt(Math.random())*m;return 'cx="'+(50+Math.cos(a)*r).toFixed(1)+'" cy="'+(50+Math.sin(a)*r).toFixed(1)+'"';}
  function el(rx,ry,fill,op){return '<ellipse '+pt(34)+' rx="'+rx+'" ry="'+ry+'" fill="'+fill+'" opacity="'+(op||1)+'" transform="rotate('+R(0,180).toFixed(0)+' 50 50)"/>';}
  for(i=0;i<9;i++){var a1=R(0,6.283),a2=a1+R(.8,1.8),r1=R(14,36);t+='<path d="M'+(50+Math.cos(a1)*r1).toFixed(1)+' '+(50+Math.sin(a1)*r1).toFixed(1)+'Q'+(50+Math.cos((a1+a2)/2)*(r1+R(-8,8))).toFixed(1)+' '+(50+Math.sin((a1+a2)/2)*(r1+R(-8,8))).toFixed(1)+' '+(50+Math.cos(a2)*r1).toFixed(1)+' '+(50+Math.sin(a2)*r1).toFixed(1)+'" stroke="'+(i%2?'#fff':f[3])+'" stroke-width="1.5" fill="none" opacity="'+(i%2?.28:.22)+'"/>';}
  if(k==="chips")for(i=0;i<16;i++)t+=el(R(1.6,3.4).toFixed(1),R(1,1.9).toFixed(1),c);
  if(k==="specks")for(i=0;i<26;i++)t+=el(.7,.6,c,.7);
  if(k==="berry"){for(i=0;i<12;i++)t+=el(R(2,4).toFixed(1),R(1.4,2.6).toFixed(1),c,.75);}
  if(k==="chunks"){for(i=0;i<8;i++)t+=el(R(4,6.5).toFixed(1),R(3,4.5).toFixed(1),c);for(i=0;i<14;i++)t+=el(1.5,1.1,"#3a2217");}
  if(k==="nuts"){for(i=0;i<7;i++)t+=el(R(4,6).toFixed(1),R(3,4).toFixed(1),c);for(i=0;i<5;i++)t+=el(4,3.6,"#fffaf0",.95);}
  if(k==="swirl"){t+='<path d="M14 40C34 14 46 62 66 36S84 34 90 50" stroke="'+c+'" stroke-width="4" fill="none" opacity=".85"/><path d="M12 62C30 44 50 84 70 60" stroke="'+c+'" stroke-width="3.4" fill="none" opacity=".85"/>';for(i=0;i<8;i++)t+=el(3.2,2.4,"#8a5a2b");}
  if(k==="rainbow")t+='<path d="M0 30C30 10 60 40 100 18" stroke="#fff0c2" stroke-width="16" fill="none" opacity=".85"/><path d="M0 52C30 32 60 62 100 40" stroke="#ff5d8f" stroke-width="16" fill="none" opacity=".85"/><path d="M0 76C30 56 60 86 100 64" stroke="#ffd23c" stroke-width="16" fill="none" opacity=".85"/>';
  return '<svg viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="'+id+'" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="'+f[2]+'"/><stop offset=".6" stop-color="'+f[1]+'"/><stop offset="1" stop-color="'+f[3]+'"/></radialGradient><clipPath id="'+id+'c"><circle cx="50" cy="50" r="40"/></clipPath></defs>'
   +'<g filter="url(#real)"><path d="'+scal(46,34,3)+'" fill="'+f[1]+'" stroke="'+f[3]+'" stroke-width="1.2"/><circle cx="50" cy="50" r="40" fill="url(#'+id+')"/><g clip-path="url(#'+id+'c)">'+t+'</g></g>'
   +'<ellipse cx="36" cy="32" rx="16" ry="9" fill="#fff" opacity=".4" filter="url(#soft)"/></svg>';
}

  if(kind==="ice"){e.className="scoop";var im=document.createElement("img");im.src=d[1];im.alt=d[0];im.draggable=false;e.appendChild(im);}
  else if(d[1]==="bar"){e.className="bar";e.style.background=d[2];}
  else if(d[1]==="ball"){e.className="ball";}
  else if(d[1]==="tri"){e.className="tri";}
  else if(d[1]==="gar"){e.className="gar g-"+d[2];e.innerHTML=garSVG(d[2]);}
  else if(d[1]==="top"){e.className="top";e.textContent=d[2];}
  else if(d[1]==="spr"){e.className="spr";}
  return e;
}
function place(kind,d){
  var e=make(kind,d); e.classList.add("it"); if(kind==="ice")e.style.width=d[2]+"%"; e.dataset.bites=0;
  var a=Math.random()*6.283, r=Math.random()*26;
  e.style.left=(50+Math.cos(a)*r)+"%"; e.style.top=(50+Math.sin(a)*r)+"%";
  e.style.setProperty("--r",(Math.random()*40-20)+"deg"); e.style.zIndex=z++;
  bind(e); plate.appendChild(e); update(); return e;
}
function bind(e){
  var drag=false;
  e.addEventListener("pointerdown",function(ev){
    if(eating){bite(e);return;}
    drag=true; e.setPointerCapture(ev.pointerId); e.style.zIndex=z++; ev.preventDefault();
  });
  e.addEventListener("pointermove",function(ev){
    if(!drag)return;
    var b=plate.getBoundingClientRect();
    e.style.left=Math.min(90,Math.max(10,(ev.clientX-b.left)/b.width*100))+"%";
    e.style.top=Math.min(90,Math.max(10,(ev.clientY-b.top)/b.height*100))+"%";
  });
  e.addEventListener("pointerup",function(){drag=false;});
  e.addEventListener("pointercancel",function(){drag=false;});
}
var YUM=["Yum!","So good.","Another bite?","Cold and sweet.","Brain freeze!","Best bite yet."];
function bite(e){
  var n=+e.dataset.bites+1; e.dataset.bites=n;
  document.getElementById("note").textContent=YUM[Math.floor(Math.random()*YUM.length)];
  if(n>=3){e.classList.add("pop");setTimeout(function(){e.remove();update();},280);}
  else e.style.setProperty("--s",1-n*0.28);
}
function update(){
  var s=plate.querySelectorAll(".scoop:not(.pop)").length, t=plate.querySelectorAll(".it:not(.scoop):not(.pop)").length;
  document.getElementById("count").textContent=(s+t)?s+" scoop"+(s===1?"":"s")+", "+t+" treat"+(t===1?"":"s"):"Empty plate";
  if(!(s+t)&&eating)document.getElementById("note").textContent="Plate cleared. Time for seconds.";
}
function panel(kind,list){
  grid.innerHTML="";
  list.forEach(function(d){
    var b=document.createElement("button"); b.className="opt";
    var sw=document.createElement("div"); sw.className="sw"; sw.appendChild(make(kind,d));
    var l=document.createElement("span"); l.textContent=d[0];
    b.appendChild(sw); b.appendChild(l);
    b.onclick=function(){setEating(false);place(kind,d);document.getElementById("note").textContent=MESSAGE;};
    grid.appendChild(b);
  });
}
var TABS=[["Ice cream","ice",ICE],["Chocolates","choc",CHOC]];
TABS.forEach(function(t,i){
  var b=document.createElement("button"); b.textContent=t[0]; b.setAttribute("role","tab");
  b.onclick=function(){[].forEach.call(tabsEl.children,function(x){x.classList.remove("on");});b.classList.add("on");panel(t[1],t[2]);};
  tabsEl.appendChild(b); if(i===0)b.click();
});
function setEating(v){
  eating=v; plate.classList.toggle("eat",v);
  var b=document.getElementById("eatBtn"); b.classList.toggle("on",v); b.setAttribute("aria-pressed",v);
  b.textContent=v?"Back to building":"Eat mode";
  if(v)document.getElementById("note").textContent="Tap anything on the plate to take a bite.";
}
document.getElementById("eatBtn").onclick=function(){setEating(!eating);};
document.getElementById("clear").onclick=function(){plate.innerHTML="";update();};
document.getElementById("rand").onclick=function(){
  setEating(false); plate.innerHTML="";
  function pick(a){return a[Math.floor(Math.random()*a.length)];}
  for(var i=0;i<3;i++)place("ice",pick(ICE));
  for(var j=0;j<2;j++)place("choc",pick(CHOC));
  place("top",pick(TOPS)); document.getElementById("note").textContent=MESSAGE;
};
</script>
</body>
</html>
